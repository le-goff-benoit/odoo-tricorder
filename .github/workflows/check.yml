name: Vérifier Tricorder
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    env:
      TRICORDER_AGENTS_DIR: ${{ github.workspace }}/.test-tools/odoo-crew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Outillage Odoo de référence
        uses: actions/checkout@v4
        with:
          repository: le-goff-benoit/odoo-crew
          # Crew 0.3.1 : contrat Tricorder et profils de référence.
          ref: 75612ee195f08b5a764e5aac303d453741666457
          path: .test-tools/odoo-crew
      - name: Dépendances du terminal et des commandes isolées
        run: sudo apt-get update && sudo apt-get install -y bubblewrap xvfb
      - run: npm ci
      - run: npm test
      - name: Vérifier le bureau
        run: xvfb-run -a npm run test:ui
        env:
          TRICORDER_AGENTS_DIR: ${{ github.workspace }}/.test-tools/odoo-crew
      - run: npm run dist
      - name: Vérifier l’application empaquetée
        run: xvfb-run -a npm run test:packaged
        env:
          TRICORDER_AGENTS_DIR: ${{ github.workspace }}/.test-tools/odoo-crew
      - run: npm run checksum
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-amd64
          path: |
            build-artifacts/*.deb
            build-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preuves-qa
          path: test-results/
