name: Vérifier Tricorder
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    env:
      TRICORDER_AGENTS_DIR: ${{ github.workspace }}/.test-tools/odoo-crew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Outillage Odoo de référence
        uses: actions/checkout@v4
        with:
          repository: le-goff-benoit/odoo-crew
          # Crew: shared release memory, document/source catalogues and receipt validation.
          ref: f11913d1bf9896e32286b0e24bed041984bc8b60
          path: .test-tools/odoo-crew
      - run: npm ci
      - run: npm test
      - name: Vérifier le bureau
        run: xvfb-run -a npm run test:ui
        env:
          TRICORDER_AGENTS_DIR: ${{ github.workspace }}/.test-tools/odoo-crew
      - run: npm run dist
      - name: Vérifier l’application empaquetée
        run: xvfb-run -a npm run test:packaged
        env:
          TRICORDER_AGENTS_DIR: ${{ github.workspace }}/.test-tools/odoo-crew
      - run: npm run checksum
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-amd64
          path: |
            release/*.deb
            release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preuves-qa
          path: test-results/
